<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly — Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <button class="botao-tema" id="botao-tema" aria-label="Alternar tema">
    <svg class="icone-lua" viewBox="0 0 20 20" fill="none"><path d="M17.5 10.5C16.5 13.5 13.8 15.5 10.5 15.5C6.6 15.5 3.5 12.4 3.5 8.5C3.5 5.2 5.5 2.5 8.5 1.5C7.7 3 7.3 4.7 7.5 6.5C8 10.5 11.5 13.2 15.5 12.7C16.3 12.6 17 12.3 17.5 10.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <svg class="icone-sol" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.4"/><path d="M10 2V4M10 16V18M18 10H16M4 10H2M15.5 4.5L14 6M6 14L4.5 15.5M15.5 15.5L14 14M6 6L4.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>

  <main class="tela-auth">
    <section class="painel-marca">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="grade-marca"></div>
      <div class="particulas">
        <span class="particula p1"></span>
        <span class="particula p2"></span>
        <span class="particula p3"></span>
        <span class="particula p4"></span>
        <span class="particula p5"></span>
        <span class="particula p6"></span>
      </div>

      <div class="cartao-flutuante cartao-flutuante-1">
        <span class="check-flutuante concluido">
          <svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2L4.6 8.8L10 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="linha-flutuante linha-riscada"></span>
      </div>

      <div class="cartao-flutuante cartao-flutuante-2">
        <span class="check-flutuante"></span>
        <span class="linha-flutuante"></span>
      </div>

      <div class="cartao-flutuante cartao-flutuante-3">
        <span class="check-flutuante concluido">
          <svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2L4.6 8.8L10 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="linha-flutuante linha-riscada"></span>
      </div>

      <div class="conteudo-marca">
        <span class="selo-marca">Task Manager</span>
        <h1 class="titulo-marca">TASKLY</h1>
        <p class="frase-marca">O ritmo certo para cada tarefa encontrar seu lugar.</p>
      </div>
    </section>

    <section class="painel-form">
      <div class="brilho-cartao"></div>
      <div class="cartao-auth">
        <div class="cabecalho-cartao">
          <h2 class="titulo-cartao" id="titulo-cartao">Bem-vindo!</h2>
          <p class="subtitulo-cartao" id="subtitulo-cartao">Entre para ver suas tarefas.</p>
        </div>

        <div class="abas-auth">
          <span class="aba-indicador" id="aba-indicador"></span>
          <button type="button" class="aba-btn ativa" data-aba="entrar">Entrar</button>
          <button type="button" class="aba-btn" data-aba="cadastrar">Criar conta</button>
        </div>

        <form id="form-entrar" class="formulario-auth">
          <label for="entrar-email">Email</label>
          <div class="campo-input">
            <svg class="icone-campo" viewBox="0 0 20 20" fill="none"><path d="M2.5 5.5L10 10.5L17.5 5.5M4 15.5H16C16.8284 15.5 17.5 14.8284 17.5 14V6C17.5 5.17157 16.8284 4.5 16 4.5H4C3.17157 4.5 2.5 5.17157 2.5 6V14C2.5 14.8284 3.17157 15.5 4 15.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="email" id="entrar-email" required placeholder="voce@email.com">
          </div>

          <label for="entrar-senha">Senha</label>
          <div class="campo-input">
            <svg class="icone-campo" viewBox="0 0 20 20" fill="none"><path d="M5.5 9V6.5C5.5 4.29 7.29 2.5 9.5 2.5H10.5C12.71 2.5 14.5 4.29 14.5 6.5V9M5 17.5H15C15.8284 17.5 16.5 16.8284 16.5 16V10.5C16.5 9.67157 15.8284 9 15 9H5C4.17157 9 3.5 9.67157 3.5 10.5V16C3.5 16.8284 4.17157 17.5 5 17.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="password" id="entrar-senha" required placeholder="••••••••">
            <button type="button" class="botao-olho" data-alvo="entrar-senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4.5 4.5 10 4.5 18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.25" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>

          <div class="linha-opcoes">
            <label class="opcao-lembrar">
              <input type="checkbox" id="entrar-lembrar">
              <span class="caixa-check"></span>
              Lembrar de mim
            </label>
            <a href="#" class="link-esqueci">Esqueci minha senha</a>
          </div>

          <p id="erro-entrar" class="mensagem-erro"></p>

          <button type="submit" class="botao-principal">
            Entrar
            <svg class="icone-seta" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>

        <form id="form-cadastrar" class="formulario-auth escondido">
          <label for="cadastrar-email">Email</label>
          <div class="campo-input">
            <svg class="icone-campo" viewBox="0 0 20 20" fill="none"><path d="M2.5 5.5L10 10.5L17.5 5.5M4 15.5H16C16.8284 15.5 17.5 14.8284 17.5 14V6C17.5 5.17157 16.8284 4.5 16 4.5H4C3.17157 4.5 2.5 5.17157 2.5 6V14C2.5 14.8284 3.17157 15.5 4 15.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="email" id="cadastrar-email" required placeholder="voce@email.com">
          </div>

          <label for="cadastrar-senha">Senha</label>
          <div class="campo-input">
            <svg class="icone-campo" viewBox="0 0 20 20" fill="none"><path d="M5.5 9V6.5C5.5 4.29 7.29 2.5 9.5 2.5H10.5C12.71 2.5 14.5 4.29 14.5 6.5V9M5 17.5H15C15.8284 17.5 16.5 16.8284 16.5 16V10.5C16.5 9.67157 15.8284 9 15 9H5C4.17157 9 3.5 9.67157 3.5 10.5V16C3.5 16.8284 4.17157 17.5 5 17.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="password" id="cadastrar-senha" required placeholder="••••••••">
            <button type="button" class="botao-olho" data-alvo="cadastrar-senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4.5 4.5 10 4.5 18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.25" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>

          <p class="dica-senha">Use pelo menos 6 caracteres.</p>

          <p id="erro-cadastrar" class="mensagem-erro"></p>

          <button type="submit" class="botao-principal">
            Criar conta
            <svg class="icone-seta" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
